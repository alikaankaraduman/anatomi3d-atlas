# Anatomi 3D: Android uygulamasını GitHub Actions'ta (bulutta, ücretsiz) derler.
#
# Süreler: APK yaklaşık 1,5 dakikada derlenir, emülatör sınaması yaklaşık 5 dakika sürer. İmzalı yayın paketi işi imza
# sırları yoksa uyarı yazıp biter. Bir adım kırmızı olursa günlükte ilk kırmızı adıma bakın.
#
# Üç iş: "debug-apk" (her çalıştırmada), "release-aab" ve "emulator-smoke" (yalnız elle başlatılınca).
# "v" ile başlayan bir etiket gönderilince APK ayrıca deponun sürüm (Releases) sayfasına eklenir: telefondan
# doğrudan indirilebilir.
#
# Kullanmak için (bir kez):
#   1. Bu depoyu GitHub'a gönderin ya da çatallayın (.github/, app/, docs/ ... kökte olmalı). Herkese açık depoda
#      Actions dakikaları ücretsizdir; özel depoda ücretsiz planın aylık dakika sınırı vardır.
#   2. Depo › Actions sekmesi › "Android" › "Run workflow". Bitince çalıştırmanın sayfasında, "Artifacts" altında
#      "anatomi3d-debug-apk" çıkar (zip; içindeki app-debug.apk telefona kurulabilir, 14 gün saklanır).
#   3. İmzalı yayın paketi (Google Play için .aab) isteniyorsa depo › Settings › Secrets and variables › Actions ›
#      "New repository secret" ile şu dört sırrı ekleyin (anahtarın oluşturulması docs/MOBILE.md'de):
#        ANDROID_KEYSTORE_BASE64   anahtar deposu dosyasının (.jks) base64 metni
#        ANDROID_KEYSTORE_PASSWORD anahtar deposunun parolası
#        ANDROID_KEY_ALIAS         anahtarın adı (alias)
#        ANDROID_KEY_PASSWORD      anahtarın parolası
#      Sırlar yoksa "release-aab" işi yalnız bir uyarı yazar ve derlemeden biter.
# "v" ile başlayan bir etiket gönderildiğinde (ör. git tag v1.0.0 && git push origin v1.0.0) yalnız hata ayıklama
# APK'sı derlenir; imzalı paket yalnız elle başlatılan çalıştırmada derlenir.

name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Hata ayıklama APK'sı
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # yalnız etiketli derlemede APK'yı sürüm sayfasına eklemek için
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Paketler (package-lock.json'a göre)
        run: npm ci

      - name: Web uygulamasını derle (app/dist)
        run: npm run build

      - name: dist'i Android projesine kopyala
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic   # MIT lisanslı temel önbellek; varsayılan "enhanced" önbellek MIT lisanslı değil

      - name: assembleDebug
        working-directory: app/android
        # Windows'ta gönderilen dosyada çalıştırma izni olmayabilir
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı denetle (kimlik, sürüm, içindeki web dosyaları)
        working-directory: app/android
        # indirmeye gerek kalmadan günlükten okunabilsin diye: paket bilgisi, boyut ve uygulamanın web dosyaları
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^uses-permission|^launchable-activity|^native-code" || true
          echo "--- içindeki web uygulaması ---"
          unzip -l "$APK" | grep -E "assets/public/(index\.html|sw\.js|lisanslar\.txt|gizlilik\.html|manifest\.webmanifest|assets/|models/|data/)" | awk '{print $1, $4}' | sort -k2 | head -80
          echo "--- sayılar ---"
          echo "model: $(unzip -l "$APK" | grep -c 'assets/public/models/.*\.glb')  veri: $(unzip -l "$APK" | grep -c 'assets/public/data/.*\.json')  eklenti: $(unzip -p "$APK" assets/capacitor.plugins.json | tr -d '\n' | head -c 300)"
          unzip -l "$APK" | grep -q "assets/public/index.html"
          test "$(unzip -l "$APK" | grep -c 'assets/public/models/.*\.glb')" -ge 17

      - uses: actions/upload-artifact@v7
        with:
          name: anatomi3d-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Etiketli derlemede APK'yı sürüm sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/anatomi3d-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          {
            echo "Deneme derlemesi (hata ayıklama imzalı; mağaza için değildir)."
            echo
            echo "Kurmak için: Android telefonda bu sayfayı GitHub hesabınla aç, aşağıdaki .apk dosyasını indir ve aç;"
            echo "telefon sorarsa tarayıcıya \"bilinmeyen uygulamaları yükleme\" izni ver."
            echo
            echo "Her derleme farklı bir deneme anahtarıyla imzalanır: yeni bir derlemeyi kurmadan önce eskisini kaldır"
            echo "(kaldırınca o telefondaki ilerleme ve kullanıcılar silinir; önce Kullanıcı > Dışa aktar ile yedekle)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY" --title "Anatomi 3D ${GITHUB_REF_NAME} (deneme)" --notes-file "$RUNNER_TEMP/notes.md" --prerelease

  release-aab:
    name: İmzalı yayın paketi (AAB)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: İmza sırları var mı?
        id: secrets
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::İmza sırları eksik (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); imzalı paket derlenmedi."
          fi
        working-directory: .

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build

      - if: steps.secrets.outputs.ok == 'true'
        run: npx cap sync android

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: steps.secrets.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic   # yukarıdaki gibi: yalnız MIT lisanslı temel önbellek

      - name: Anahtar deposunu geçici klasöre çöz
        if: steps.secrets.outputs.ok == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: bundleRelease
        if: steps.secrets.outputs.ok == 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: İmzayı denetle
        if: steps.secrets.outputs.ok == 'true'
        working-directory: app/android
        # imzasız bir dosyada da jarsigner 0 ile çıkar ("jar is unsigned"); bu yüzden çıktıda "jar verified" aranır
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anatomi3d-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Anahtar deposunu sil
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
        working-directory: .

  # Derlenen APK'yı bir Android emülatöründe açar ve gerçek WebView içinde sınar: açılış, sistemlerin yüklenmesi,
  # Android Geri tuşu, uygulama içi belge penceresi, cihazdaki kullanıcı profili (app/tools/_qawork/android/smoke.mjs).
  # Sonuç günlüğe yazılır; ekran görüntüleri ve ayrıntılar "emulator-smoke" adıyla saklanır.
  emulator-smoke:
    name: Emülatörde açılış sınaması
    if: github.event_name == 'workflow_dispatch'
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: anatomi3d-debug-apk
          path: apk

      - name: KVM (emülatörün donanım hızlandırması)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash app/tools/_qawork/android/smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-smoke
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 7
